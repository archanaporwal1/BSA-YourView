name: Auto-Generate Keystore & Save Directly to GitHub Secrets

on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: "Paste your GitHub Fine-Grained Token (with Secrets: Read & Write permission)"
        required: true
      store_password:
        description: "Choose Store Password (min 6 chars)"
        required: true
        default: "YourView@2026"
      key_password:
        description: "Choose Key Password (keep same as Store Password)"
        required: true
        default: "YourView@2026"
      key_alias:
        description: "Key Alias name"
        required: true
        default: "yourview-key"

jobs:
  generate-and-save:
    name: Generate Keystore & Save All 4 Secrets Automatically
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Keystore & Push Directly to Repository Secrets
        env:
          GH_TOKEN: ${{ github.event.inputs.gh_pat }}
          STORE_PASS: ${{ github.event.inputs.store_password }}
          KEY_PASS: ${{ github.event.inputs.key_password }}
          ALIAS_NAME: ${{ github.event.inputs.key_alias }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p keystore_backup
          keytool -genkeypair -v \
            -keystore keystore_backup/my-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ALIAS_NAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=YourView, OU=Mobile, O=YourView, L=Hyderabad, S=Telangana, C=IN"

          # Automatically save all 4 secrets directly into GitHub Actions Secrets (zero copy-paste!)
          base64 -w 0 keystore_backup/my-upload-key.jks | gh secret set KEYSTORE_BASE64 --repo "$REPO"
          printf "%s" "$STORE_PASS" | gh secret set STORE_PASSWORD --repo "$REPO"
          printf "%s" "$KEY_PASS" | gh secret set KEY_PASSWORD --repo "$REPO"
          printf "%s" "$ALIAS_NAME" | gh secret set KEY_ALIAS --repo "$REPO"

          echo "### All 4 Secrets Saved Automatically!" >> "$GITHUB_STEP_SUMMARY"
          echo "Your repository secrets (\`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`, \`KEY_ALIAS\`) are now configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Keystore Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: keystore_backup/my-upload-key.jks
          retention-days: 7
