name: Create Release Keystore & Show Copy-Paste Secrets

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Keystore Password (min 6 chars, e.g. YourView@2026)"
        required: true
        default: "YourView@2026"
      key_password:
        description: "Key Password (min 6 chars, keep same as Store Password)"
        required: true
        default: "YourView@2026"
      key_alias:
        description: "Key Alias (MUST be 'upload' to match app/build.gradle.kts)"
        required: true
        default: "upload"

jobs:
  create-keystore:
    name: Generate Keystore & Print Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Generate my-upload-key.jks and Base64 string
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          KEY_PASS: ${{ github.event.inputs.key_password }}
          ALIAS_NAME: ${{ github.event.inputs.key_alias }}
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ALIAS_NAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=YourView, OU=Engineering, O=BSA-YourView, L=Hyderabad, ST=Telangana, C=IN"

          BASE64_STR=$(base64 -w 0 my-upload-key.jks)

          {
            echo "## Copy & Paste These 3 Secrets into GitHub Settings"
            echo ""
            echo "Go to **Settings → Secrets and variables → Actions → Repository secrets** and add:"
            echo ""
            echo "| Secret Name | Value to Copy |"
            echo "| :--- | :--- |"
            echo "| \`STORE_PASSWORD\` | \`$STORE_PASS\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASS\` |"
            echo ""
            echo "### \`KEYSTORE_BASE64\` (Tap the copy icon in the top-right corner of the box below):"
            echo "\`\`\`text"
            echo "$BASE64_STR"
            echo "\`\`\`"
            echo ""
            echo "> **Key Alias used:** \`$ALIAS_NAME\` (matches \`app/build.gradle.kts\`)"
            echo "> **Important:** After copying and downloading the backup artifact below, delete this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup of my-upload-key.jks
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key-backup
          path: my-upload-key.jks
          retention-days: 1
