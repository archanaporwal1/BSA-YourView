name: Generate Android Release Keystore (One-Time Setup)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Choose a strong Store Password (min 6 characters)"
        required: true
        default: "YourView@2026"
      key_password:
        description: "Choose a Key Password (keep same as Store Password)"
        required: true
        default: "YourView@2026"
      key_alias:
        description: "Key Alias name"
        required: true
        default: "yourview-key"
      common_name:
        description: "Your Name or Organization (CN)"
        required: true
        default: "YourView"

jobs:
  create-keystore:
    name: Generate & Export Keystore Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Release Keystore & Base64
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          KEY_PASS: ${{ github.event.inputs.key_password }}
          ALIAS_NAME: ${{ github.event.inputs.key_alias }}
          CN_NAME: ${{ github.event.inputs.common_name }}
        run: |
          mkdir -p keystore_bundle
          keytool -genkeypair -v \
            -keystore keystore_bundle/my-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ALIAS_NAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=$CN_NAME, OU=Mobile, O=YourView, L=Hyderabad, S=Telangana, C=IN"

          base64 -w 0 keystore_bundle/my-upload-key.jks > keystore_bundle/KEYSTORE_BASE64.txt

          cat <<EOF > keystore_bundle/README_SECRETS.txt
          Add these exact 4 secrets to GitHub:
          Repo Settings -> Secrets and variables -> Actions -> New repository secret

          1. KEYSTORE_BASE64 -> Paste the entire content of KEYSTORE_BASE64.txt
          2. STORE_PASSWORD  -> $STORE_PASS
          3. KEY_PASSWORD    -> $KEY_PASS
          4. KEY_ALIAS       -> $ALIAS_NAME

          IMPORTANT: Keep my-upload-key.jks backed up safely! Never commit it to a public repo.
          EOF

      - name: Upload Keystore & Base64 Bundle as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-bundle
          path: keystore_bundle/
          retention-days: 7
