name: Build BSA-YourView APK & Publish In-App Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version tag (e.g., 1.0.2). Leave empty to use app/build.gradle.kts versionName."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish BSA-YourView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run CI Injector (Firebase Config & Version Info)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -f ci_injector.py ]; then
            python3 ci_injector.py
          else
            echo "ci_injector.py not found, skipping."
          fi

      - name: Prepare debug & release signing keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Ensure debug.keystore exists for debug builds or fallback tasks
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Priority 1: Use my-upload-key.jks uploaded directly in repo root
          if [ -f my-upload-key.jks ]; then
            echo "Found my-upload-key.jks in repository."
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          # Priority 2: Decode from KEYSTORE_BASE64 secret (ignoring invalid base64 exit code if copy-paste had extra chars)
          elif [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
            if printf '%s' "$CLEAN_B64" | base64 -d > my-upload-key.jks 2>/dev/null && [ -s my-upload-key.jks ]; then
              echo "Decoded my-upload-key.jks from KEYSTORE_BASE64 secret."
              echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
            else
              echo "ERROR: KEYSTORE_BASE64 could not be decoded. Check that the entire Base64 string was pasted cleanly."
              rm -f my-upload-key.jks
              exit 1
            fi
          else
            echo "No release keystore found."
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Error: Release keystore found, but STORE_PASSWORD or KEY_PASSWORD secret is missing."
              exit 1
            fi
            echo "Building signed Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Warning: No my-upload-key.jks or KEYSTORE_BASE64 found. Falling back to debug build."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate built APK & extract metadata
        id: apk_meta
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK file found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ] && [ -f app/build.gradle.kts ]; then
            VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          VERSION_NAME="${VERSION_NAME:-1.0.0}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_meta.outputs.version_name }}
          name: BSA-YourView v${{ steps.apk_meta.outputs.version_name }}
          files: ${{ steps.apk_meta.outputs.apk_path }}
          draft: false
          prerelease: false
