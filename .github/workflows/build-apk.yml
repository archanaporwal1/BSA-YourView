name: Build BSA-YourView APK & Publish In-App Update

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version tag (e.g., 1.1.0). Leave empty to use app/build.gradle.kts versionName."
        required: false
        default: ""
      skip_tests:
        description: "Skip JVM unit tests before building APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-bsa-yourview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build, Test & Publish BSA-YourView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run CI Injector (Auto-Adopt Modules, Keystore Secrets, Updater Config & Version)
        id: injector
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALIAS: ${{ secrets.ALIAS }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          if [ -f ci_injector.py ]; then
            python3 ci_injector.py --ci
          else
            echo "ci_injector.py not found, using default :app settings."
            echo "APP_MODULE=:app" >> "$GITHUB_ENV"
            echo "APP_MODULE_DIR=app" >> "$GITHUB_ENV"
            echo "GRADLE_TEST_TASKS=:app:testDebugUnitTest" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Ensure Gradle wrapper or system Gradle is ready
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "gradlew not found in repo root; using system gradle 9.3.1."
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Run Automated Unit Tests across All Discovered Modules
        if: ${{ github.event.inputs.skip_tests != 'true' && env.GRADLE_TEST_TASKS != '' }}
        run: |
          echo "Running unit tests for auto-adopted modules: $GRADLE_TEST_TASKS"
          $GRADLE_CMD $GRADLE_TEST_TASKS --no-daemon --stacktrace

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.EFFECTIVE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          TARGET_MOD="${APP_MODULE:-:app}"
          echo "Signing mode: ${SIGNING_MODE:-unknown} | Expected cert SHA-256: ${SIGNING_CERT_SHA256:-N/A}"
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "Building signed Release APK for $TARGET_MOD..."
            $GRADLE_CMD "${TARGET_MOD}:assembleRelease" --no-daemon --stacktrace
          else
            echo "Building signed Debug APK for $TARGET_MOD using adopted debug.keystore..."
            $GRADLE_CMD "${TARGET_MOD}:assembleDebug" --no-daemon --stacktrace
          fi

      - name: Package Branded APK & Generate SHA-256 Update Manifest
        id: apk_meta
        run: |
          APP_DIR="${APP_MODULE_DIR:-app}"
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            APK_PATH=$(find "${APP_DIR}/build/outputs/apk/release" -type f -name "*.apk" 2>/dev/null | head -n 1)
          else
            APK_PATH=$(find "${APP_DIR}/build/outputs/apk/debug" -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "${APP_DIR}/build/outputs/apk" -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK file found in ${APP_DIR}/build/outputs/apk!"
            exit 1
          fi

          RESOLVED_VER="${VERSION_NAME:-${{ github.event.inputs.version_name }}}"
          if [ -z "$RESOLVED_VER" ] && [ -f "${APP_DIR}/build.gradle.kts" ]; then
            RESOLVED_VER=$(grep -E 'versionName\s*=' "${APP_DIR}/build.gradle.kts" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          RESOLVED_VER="${RESOLVED_VER:-1.0.0}"

          mkdir -p dist
          BRANDED_APK="dist/BSA-YourView-v${RESOLVED_VER}.apk"
          cp "$APK_PATH" "$BRANDED_APK"
          echo "Packaged branded APK: $BRANDED_APK"

          python3 ci_injector.py \
            --generate-update-manifest \
            --apk "$BRANDED_APK" \
            --version-name "$RESOLVED_VER" \
            --manifest-out "dist/update-manifest.json" \
            --notes-out "dist/release-notes.md"

          if [ -f build-module-manifest.json ]; then
            cp build-module-manifest.json dist/build-module-manifest.json
          fi

          echo "apk_path=$BRANDED_APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$RESOLVED_VER" >> "$GITHUB_OUTPUT"

      - name: Upload Build & Module Manifest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BSA-YourView-v${{ steps.apk_meta.outputs.version_name }}
          path: |
            dist/BSA-YourView-v${{ steps.apk_meta.outputs.version_name }}.apk
            dist/update-manifest.json
            dist/build-module-manifest.json
            dist/release-notes.md
          retention-days: 30

      - name: Publish Release & In-App Update Manifest to GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_meta.outputs.version_name }}
          name: BSA-YourView v${{ steps.apk_meta.outputs.version_name }}
          body_path: dist/release-notes.md
          files: |
            dist/BSA-YourView-v${{ steps.apk_meta.outputs.version_name }}.apk
            dist/update-manifest.json
            dist/build-module-manifest.json
          draft: false
          prerelease: false
