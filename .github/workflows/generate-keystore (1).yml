name: Generate Android Release Keystore (One-Time Setup)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Choose a strong Store Password (min 6 characters)"
        required: true
        default: "YourView@2026"
      key_password:
        description: "Choose a Key Password (keep same as Store Password)"
        required: true
        default: "YourView@2026"
      key_alias:
        description: "Key Alias name"
        required: true
        default: "yourview-key"
      common_name:
        description: "Your Name or Organization (CN)"
        required: true
        default: "YourView"

jobs:
  create-keystore:
    name: Generate & Print Keystore Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Release Keystore & Print Base64
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          KEY_PASS: ${{ github.event.inputs.key_password }}
          ALIAS_NAME: ${{ github.event.inputs.key_alias }}
          CN_NAME: ${{ github.event.inputs.common_name }}
        run: |
          mkdir -p keystore_bundle
          keytool -genkeypair -v \
            -keystore keystore_bundle/my-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ALIAS_NAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=$CN_NAME, OU=Mobile, O=YourView, L=Hyderabad, S=Telangana, C=IN"

          B64=$(base64 -w 0 keystore_bundle/my-upload-key.jks)
          echo "$B64" > keystore_bundle/KEYSTORE_BASE64.txt

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Copy-Paste These 4 Values Into GitHub Secrets
          Go to **Settings → Secrets and variables → Actions → New repository secret**:

          | Secret Name | Value |
          | :--- | :--- |
          | \`STORE_PASSWORD\` | \`$STORE_PASS\` |
          | \`KEY_PASSWORD\` | \`$KEY_PASS\` |
          | \`KEY_ALIAS\` | \`$ALIAS_NAME\` |

          #### \`KEYSTORE_BASE64\` (Copy the entire line below):
          \`\`\`text
          $B64
          \`\`\`

          > **Security Warning:** After copying these into your Secrets, delete this workflow run (top-right **...** menu → **Delete workflow run**) and delete \`.github/workflows/generate-keystore.yml\` so nobody else can view your signing key.
          EOF

      - name: Upload Keystore Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-bundle
          path: keystore_bundle/my-upload-key.jks
          retention-days: 7
